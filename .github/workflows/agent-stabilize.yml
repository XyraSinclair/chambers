name: agent consolidation stabilizer

on:
  push:
    branches:
      - agent/consolidate-chamber

permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: chambers-consolidation-stabilizer
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/consolidate-chamber

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Take the settled branch head
        run: |
          sleep 180
          git config user.name "chambers-structure-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent/consolidate-chamber
          git reset --hard origin/agent/consolidate-chamber

      - name: Verify, with a conservative test-layout fallback
        id: verify
        run: |
          set -euo pipefail
          test -d workbench/pipeline
          test -d workbench/notes/research
          test -f docs/ARCHITECTURE.md
          test ! -e chambers/pipeline
          test ! -e docs/research

          python -m pip install pytest
          python -m chambers.compliance_kit.make_kit
          python -m compileall -q chambers workbench tests

          set +e
          python -m pytest -q > "$RUNNER_TEMP/pytest-first.txt" 2>&1
          first_status=$?
          set -e

          if test "$first_status" -ne 0; then
            echo "reference-test relocation changed discovery or fixture locality; restoring the prior locations"
            if test -f tests/reference/test_requester_bundle.py; then
              git mv tests/reference/test_requester_bundle.py chambers/test_requester_bundle.py
            fi
            if test -f tests/reference/test_chamber_kernel_meter.py; then
              git mv tests/reference/test_chamber_kernel_meter.py chambers/test_chamber_kernel_meter.py
            fi
            python -m pytest -q | tee "$RUNNER_TEMP/pytest.txt"
            test_layout="component-local"
          else
            cat "$RUNNER_TEMP/pytest-first.txt" | tee "$RUNNER_TEMP/pytest.txt"
            test_layout="tests/reference"
          fi

          python -m chambers.compliance_kit.make_kit --check | tee "$RUNNER_TEMP/kit.txt"
          git diff --check
          echo "pytest_summary=$(tail -n 1 "$RUNNER_TEMP/pytest.txt")" >> "$GITHUB_OUTPUT"
          echo "kit_summary=$(tail -n 1 "$RUNNER_TEMP/kit.txt")" >> "$GITHUB_OUTPUT"
          echo "test_layout=$test_layout" >> "$GITHUB_OUTPUT"

      - name: Remove every agent-only workflow and push
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'agent-*.yml' -delete
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "tests: preserve executable contracts through the restructure"
            git fetch origin agent/consolidate-chamber
            git rebase origin/agent/consolidate-chamber || {
              git rebase --abort
              echo "remote advanced during stabilization; refusing to overwrite it" >&2
              exit 1
            }
            git push origin HEAD:agent/consolidate-chamber
          fi

      - name: Wait for final-head public CI
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            sleep 10
            if gh pr checks 2 --repo XyraSinclair/chambers --watch --fail-fast; then
              exit 0
            fi
          done
          exit 1

      - name: Publish stabilized verification on the draft PR
        env:
          PYTEST_SUMMARY: ${{ steps.verify.outputs.pytest_summary }}
          KIT_SUMMARY: ${{ steps.verify.outputs.kit_summary }}
          TEST_LAYOUT: ${{ steps.verify.outputs.test_layout }}
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Purpose

          Make the repository legible as a maintained technical system rather than as an undifferentiated research dump.

          ## Structural cut

          - Executable economies and mechanism probes now live directly under the non-normative \`workbench/\`. Their path depth is unchanged, preserving file-relative fixture and repository-root behavior.
          - Autoresearch, ideation, deep research, frontier papers, frameworks, and stories now live under \`workbench/notes/\`.
          - Maintained Python is tested not to import the workbench; workbench code may still exercise maintained interfaces.
          - Reference contract-test layout after regression pressure: \`${TEST_LAYOUT}\`.

          ## Reference application

          - \`chambers/CHAMBER.md\` contains model-facing Chamber Law only.
          - \`chambers/reference/README.md\` contains the operator runbook.
          - The application, court-file verifier, requester-bundle verifier, confinement demo, and compliance kit remain maintained surfaces.
          - The two offline verifiers remain separate. Their repeated parsing and hashing logic is an independence property, not cleanup debt.

          ## Public reading surface

          - \`docs/ARCHITECTURE.md\` maps canon, protocol specifications, implementations, proof scope, reference integration, and workbench.
          - Imports, commands, and repository links use the new workbench paths.
          - Research location now carries status: material under \`workbench/\` is public but non-normative.

          ## Compatibility

          Normative protocol identifiers, frozen trace bytes, charge arithmetic, finding codes, settlement law, and theorem statements are unchanged. Explicitly experimental import paths changed from \`chambers.<experiment>\` to \`workbench.<experiment>\`; those paths are outside the maintained compatibility surface.

          ## Verification

          - Python: \`${PYTEST_SUMMARY}\`
          - Portable evidence manifest: \`${KIT_SUMMARY}\`
          - Final-head GitHub Actions: Python, Rust, and Lean checks passed before this body was published.
          EOF
          gh api --method PATCH repos/XyraSinclair/chambers/pulls/2 \
            --raw-field title='Separate the maintained system from the workbench' \
            --raw-field body="$(cat "$RUNNER_TEMP/pr-body.md")" >/dev/null
