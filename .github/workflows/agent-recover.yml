name: agent consolidation recovery

on:
  push:
    branches:
      - agent/consolidate-chamber

permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: chambers-consolidation-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/consolidate-chamber

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Let earlier one-shot runs settle, then take the live head
        run: |
          sleep 120
          git config user.name "chambers-structure-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent/consolidate-chamber main
          git reset --hard origin/agent/consolidate-chamber
          git merge --no-edit origin/main

      - name: Establish the workbench boundary idempotently
        run: |
          set -euo pipefail

          move_path() {
            old="$1"
            new="$2"
            if test -e "$old" && ! test -e "$new"; then
              mkdir -p "$(dirname "$new")"
              git mv "$old" "$new"
            elif test -e "$old" && test -e "$new"; then
              echo "both old and new paths exist: $old, $new" >&2
              exit 1
            fi
          }

          move_path chambers/cardinal_wedge workbench/experiments/cardinal_wedge
          move_path chambers/d1_bounty workbench/experiments/d1_bounty
          move_path chambers/intro_clearing workbench/experiments/intro_clearing
          move_path chambers/ip_trade_sim workbench/experiments/ip_trade_sim
          move_path chambers/peer_sim workbench/experiments/peer_sim
          move_path chambers/pipeline workbench/experiments/pipeline

          move_path docs/autoresearch workbench/notes/autoresearch
          move_path docs/ideation workbench/notes/ideation
          move_path docs/research workbench/notes/research
          move_path docs/frontier workbench/notes/frontier
          move_path docs/stories workbench/notes/stories
          move_path docs/FRAMEWORKS.md workbench/notes/FRAMEWORKS.md
          move_path docs/STORIES.md workbench/notes/STORIES.md

          mkdir -p workbench/experiments workbench/notes chambers/reference tests/reference
          printf '%s\n' '"""Non-normative research and experiments."""' > workbench/__init__.py
          printf '%s\n' '"""Executable experiments; no compatibility guarantee."""' > workbench/experiments/__init__.py

          if test -f chambers/test_requester_bundle.py && ! test -f tests/reference/test_requester_bundle.py; then
            git mv chambers/test_requester_bundle.py tests/reference/test_requester_bundle.py
          fi
          if test -f chambers/test_chamber_kernel_meter.py && ! test -f tests/reference/test_chamber_kernel_meter.py; then
            git mv chambers/test_chamber_kernel_meter.py tests/reference/test_chamber_kernel_meter.py
          fi

          python - <<'PY'
          from pathlib import Path

          names = (
              "cardinal_wedge",
              "d1_bounty",
              "intro_clearing",
              "ip_trade_sim",
              "peer_sim",
              "pipeline",
          )
          replacements = {}
          for name in names:
              replacements[f"chambers.{name}"] = f"workbench.experiments.{name}"
              replacements[f"chambers/{name}"] = f"workbench/experiments/{name}"
              replacements[f"from chambers import {name}"] = f"from workbench.experiments import {name}"
          replacements.update(
              {
                  "docs/autoresearch": "workbench/notes/autoresearch",
                  "docs/ideation": "workbench/notes/ideation",
                  "docs/research": "workbench/notes/research",
                  "docs/frontier": "workbench/notes/frontier",
                  "docs/stories": "workbench/notes/stories",
                  "docs/FRAMEWORKS.md": "workbench/notes/FRAMEWORKS.md",
                  "docs/STORIES.md": "workbench/notes/STORIES.md",
              }
          )
          suffixes = {".py", ".md", ".toml", ".yml", ".yaml", ".ts", ".rs", ".lean", ".txt", ".cff"}
          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or ".git" in path.parts or path.suffix not in suffixes:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              rewritten = original
              for old, new in sorted(replacements.items(), key=lambda item: -len(item[0])):
                  rewritten = rewritten.replace(old, new)
              if rewritten != original:
                  path.write_text(rewritten, encoding="utf-8")

          law = Path("chambers/CHAMBER.md")
          text = law.read_text(encoding="utf-8")
          marker = "# Chamber Law"
          if marker not in text:
              raise SystemExit("CHAMBER.md has no Chamber Law marker")
          if not text.startswith(marker):
              text = text[text.index(marker):]
              law.write_text(text.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Write the status-bearing front doors
        run: |
          cat > workbench/README.md <<'EOF'
          # Workbench

          This directory is non-normative. It holds executable experiments, research notebooks, literature syntheses, discarded mechanisms, and narrative use cases.

          Nothing here defines Chambers behavior. Workbench code may import maintained interfaces to test an idea. Maintained code may not import the workbench.

          ## Contents

          - `experiments/`: metered sorting, security-research bounties, introduction clearing, IP barter, peer prediction, and the multi-machine pipeline.
          - `notes/`: autoresearch runs, ideation, deep research, frontier papers, frameworks, and story material.

          ## Promotion

          An idea leaves the workbench only when its public contract is named, its failure modes are stated, its executable behavior has deterministic evidence, and maintained documentation points to that evidence. Moving a file is not promotion.
          EOF

          cat > chambers/reference/README.md <<'EOF'
          # Reference chamber

          `chambers/chamber.py` integrates the maintained components into a local, requester-facing release gate. It is an application, not the protocol definition.

          Its model-facing policy is [`../CHAMBER.md`](../CHAMBER.md). That file contains law only. Operating instructions live here so deployment prose is not injected into every model review.

          ## Run

          From the repository root, point the chamber at one curated context packet:

          ```bash
          CHAMBER_WORKSPACE=/path/to/curated-scope \
          CHAMBER_CONTEXT_PACKET=/path/to/curated-scope/context.txt \
          python -m chambers.chamber
          ```

          The process prints a requester URL, an owner URL, and a passcode. It binds to `127.0.0.1` unless `CHAMBER_HOST` says otherwise. A tunnel is an operator choice; bearer URLs are not authentication proofs.

          Use `CHAMBER_AUTOMATIC=0` for per-run owner approval. Fixed-question mode requires `CHAMBER_FREEFORM_QUESTIONS=0` and an explicit `CHAMBER_ALLOWED_QUESTION` or `CHAMBER_ALLOWED_QUESTIONS`. State and court files live under `chambers/.chamber/`; they are operator-private.

          The worker's outer confinement is macOS-specific today. The inner model sandbox, review gates, and deterministic scans are defense in depth; none proves semantic confidentiality.

          ## Verify an output

          ```bash
          python -m chambers.check_court_file RUN_DIR \
            --expect-manifest-root sha256:...
          python -m chambers.check_requester_bundle requester_bundle.zip \
            --expect-bundle-root sha256:...
          ```

          The requester-bundle verifier is deliberately pure standard library and textually independent of the writer. Similar-looking hash and ZIP checks across the two verifiers are therefore not candidates for a shared helper.

          ## Adjacent evidence

          - [`../corpus_demo/`](../corpus_demo/) exercises confinement against a synthetic corpus.
          - [`../compliance_kit/`](../compliance_kit/) assembles the portable conformance kit.
          - [`../check_court_file.py`](../check_court_file.py) verifies the owner-side court file.
          - [`../check_requester_bundle.py`](../check_requester_bundle.py) verifies the released bundle offline.
          EOF

          cat > docs/ARCHITECTURE.md <<'EOF'
          # Repository architecture

          Chambers separates claims, implementations, evidence, and exploration. A reader should be able to tell whether a file states law, executes it, checks it, or merely investigates it.

          ## Maintained surfaces

          | Surface | Location | Role |
          |---|---|---|
          | Canon | `docs/BOOK.md`, `docs/primitives/` | Objects, axioms, refusals, and type vocabulary |
          | Protocol specifications | `chambers/kernel/*-SPEC.md`, `chambers/conformance/SPEC.md` | Versioned decision and serialization contracts |
          | Python implementation | `chambers/kernel/`, `chambers/conformance/`, `chambers/runtime/` | Reference execution and replay |
          | Rust checks | `chambers/conformance/rust/`, `chambers/kernel/rust_ledger/` | Implementations checked against frozen corpora |
          | Formal kernel | `chambers/lean/` | Theorems over the charge algebra and replayed golden traces |
          | Reference application | `chambers/chamber.py`, `chambers/reference/` | Local release-gate integration and operator runbook |
          | Portable evidence | `chambers/compliance_kit/`, `chambers/corpus_demo/` | Distributable conformance material and confinement demonstration |

          ## Workbench

          `workbench/` is the sole home for exploratory code and research records. It may depend on maintained interfaces. The maintained package must not depend on it. No workbench result raises the assurance level of the maintained system.

          ## Claim discipline

          The Rust ports are same-author implementations, not independent replications. The Lean development proves the modeled charge algebra, not end-to-end confidentiality. Golden-trace agreement is finite evidence, not an all-input refinement theorem. The reference chamber is locally reproducible; TEE attestation is not implemented.

          ## Reading order

          1. `README.md` for the claim and its limits.
          2. `docs/BOOK.md` for the minimal system.
          3. `chambers/kernel/PROTOCOL.md` for executable accounting law.
          4. `chambers/conformance/SPEC.md` and its traces for the counterparty surface.
          5. `chambers/lean/README.md` for the exact proof boundary.
          6. `workbench/README.md` only when investigating discarded or unpromoted directions.
          EOF

          cat > README.md <<'EOF'
          # Chambers

          [![ci](https://github.com/XyraSinclair/chambers/actions/workflows/ci.yml/badge.svg)](https://github.com/XyraSinclair/chambers/actions/workflows/ci.yml)

          **Private worlds become partially computable without becoming public.**

          Chambers is a protocol and reference implementation for bounded computation across private data. A requester receives a scoped result and a verifiable record of how that result was authorized, metered, reviewed, and released. The private inputs do not become a shared product database.

          A chamber has five relevant objects:

          1. a grant naming the permitted computation;
          2. a confined transform over one or more private sources;
          3. a closed or explicitly bounded output channel;
          4. a reader-relative exposure account charged before release;
          5. a court file from which the release decision can be replayed.

          The accounting path uses exact integer millibits. It meters declared channel capacity, not semantic harm, and it does not turn confidentiality into a boolean. When a channel cannot be bounded, the system records that limit rather than asserting privacy.

          ## Evidence and limits

          | Claim | Public evidence | Limit |
          |---|---|---|
          | Charge decisions are deterministic | Frozen conformance corpora and integer-only decision paths | Corpus agreement is finite evidence, not an all-input refinement proof |
          | Two implementations agree on the published corpus | Python reference and Rust ports | The ports are same-author implementations, not independent replications |
          | Core accounting laws are machine-checked | Lean proofs for the charge algebra, settlement conservation, caps, and monotonicity properties | The proofs do not cover the full application or semantic confidentiality |
          | A local release gate can produce replayable artifacts | The reference chamber, court-file verifier, requester-bundle verifier, and confinement demo | The execution ladder is local/reproducible; TEE attestation is not implemented |

          The full claim boundary is in [`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md) and the refusal register in [`docs/BOOK.md`](docs/BOOK.md).

          ## Repository map

          | Path | Status | Read it for |
          |---|---|---|
          | [`docs/BOOK.md`](docs/BOOK.md) | maintained canon | objects, axioms, theorems, and refusals |
          | [`docs/primitives/`](docs/primitives/) | maintained canon | the type vocabulary constraining the prose |
          | [`chambers/kernel/`](chambers/kernel/) | maintained implementation | ledger, metering, scope, identity, attribution, settlement, and versioned specs |
          | [`chambers/conformance/`](chambers/conformance/) | maintained counterparty surface | language-independent decision law and frozen traces |
          | [`chambers/lean/`](chambers/lean/) | maintained formal kernel | theorem statements and their exact proof boundary |
          | [`chambers/runtime/`](chambers/runtime/) | maintained runtime | reproducible local execution of bounded bundles |
          | [`chambers/reference/`](chambers/reference/) | maintained reference application | operating the local chamber and verifying its outputs |
          | [`chambers/compliance_kit/`](chambers/compliance_kit/) | maintained evidence | assembling and replaying a portable conformance kit |
          | [`workbench/`](workbench/) | non-normative | experiments, research records, discarded directions, and stories |

          Maintained Python may not import `workbench`. That dependency direction is tested.

          ## Run the public evidence

          ```bash
          python3 -m pytest -q
          python3 -m chambers.kernel.demo_work_economy
          python3 -m chambers.compliance_kit.check

          cd chambers/kernel/rust_ledger && cargo test
          cd ../../lean && lake build
          ```

          Python 3.9 or newer plus `pytest` runs the Python suite; the implementation itself is standard-library only. Rust uses `cargo`. Lean reads the pinned toolchain in `chambers/lean/lean-toolchain`.

          Exploratory demonstrations remain runnable from the workbench:

          ```bash
          python3 -m workbench.experiments.pipeline.run_pipeline
          python3 -m workbench.experiments.intro_clearing.run_clearing
          ```

          They are not part of the conformance claim.

          ## Reference chamber

          The local application is documented in [`chambers/reference/README.md`](chambers/reference/README.md). Its model-facing policy is [`chambers/CHAMBER.md`](chambers/CHAMBER.md); that file contains law only, not deployment instructions. The two offline verifiers intentionally repeat some parsing and hashing logic so that neither verifier depends on the writer it checks.

          ## Status

          The accounting layer runs, the public traces replay across Python and Rust, and the modeled charge laws build in Lean. The application remains a reference integration rather than a hosted service. Identity is Sybil-soft. The meter prices channel width rather than harm. Operator review and deterministic scans reduce disclosure risk but do not prove semantic safety.

          [`IP-MANIFEST.md`](IP-MANIFEST.md) names what this release includes and what remains private.

          ## License

          [The Harvest License](LICENSE.md). Once per year at most, the steward may ask what the work has been worth to you. An honest answer, including zero, satisfies the license. Silence after an ask does not.

          ## Prior art

          Chambers draws on quantitative information flow and g-leakage; differential privacy composition; contextual integrity; Certificate Transparency and fork consistency; peer prediction; Shapley data valuation; Ed25519; and Lean 4. Specific papers record the connections and their non-transfer boundaries.

          Conformance divergences and spec ambiguities belong in an issue naming the relevant identifier from [`docs/SPECS.md`](docs/SPECS.md). Security reports follow [`SECURITY.md`](SECURITY.md).
          EOF

          cat > docs/README.md <<'EOF'
          # Documentation

          File location signals claim status.

          ## Canon

          - [`BOOK.md`](BOOK.md) states the minimal system and its refusal register.
          - [`primitives/`](primitives/) contains the type vocabulary and calculus.
          - [`SPECS.md`](SPECS.md) is the registry of versioned executable contracts.

          ## Assurance

          - [`ARCHITECTURE.md`](ARCHITECTURE.md) separates claims, implementations, evidence, and exploration.
          - [`ASSURANCE.md`](ASSURANCE.md) defines the assurance ladder and current rung of each surface.
          - [`OPERATIONS.md`](OPERATIONS.md) grades operations rather than treating “supported” as a boolean.
          - [`MACHINES.md`](MACHINES.md) gives one command for each maintained executable surface.

          ## Runtime and licensing

          - [`RUNTIME.md`](RUNTIME.md) describes bounded bundle execution.
          - [`LICENSING.md`](LICENSING.md) explains the license mechanics; [`../LICENSE.md`](../LICENSE.md) is authoritative.

          ## Research record

          Exploratory implementations, autoresearch, ideation, frontier papers, and stories live under [`../workbench/`](../workbench/). They are public research material, not protocol law. Maintained code is forbidden from importing them.
          EOF

          cat > chambers/README.md <<'EOF'
          # Maintained Python surfaces

          This package contains the executable surfaces supporting public Chambers claims.

          - `kernel/`: accounting, ledger, scope, identity, attribution, settlement, and normative protocol specifications.
          - `conformance/`: the language-independent decision surface and frozen traces.
          - `runtime/`: reproducible local execution of bounded bundles.
          - `review_audit/`: reviewer-coherence probes used by the public evidence suite.
          - `corpus_demo/`: the synthetic confinement demonstration.
          - `compliance_kit/`: portable specifications, corpora, and verifiers.
          - `chamber.py` and `reference/`: the local reference application and operator documentation.
          - `lean/`: the formal kernel and replayed trace fixtures.

          Experimental economies and research programs live in [`../workbench/`](../workbench/). This package must not import them.
          EOF

          cat > tests/README.md <<'EOF'
          # Tests

          Repository-wide contract and boundary tests live here. Component-local tests remain beside a component when their fixtures and conformance corpora are part of that component's public evidence.

          `reference/` holds the large end-to-end contracts for the local chamber. Keeping those tests outside `chambers/` prevents test volume from obscuring the import surface without weakening discovery: `python -m pytest -q` still runs them.
          EOF

          cat > tests/test_repository_boundaries.py <<'EOF'
          from __future__ import annotations

          import ast
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          EXPERIMENTS = (
              "cardinal_wedge",
              "d1_bounty",
              "intro_clearing",
              "ip_trade_sim",
              "peer_sim",
              "pipeline",
          )

          def test_experiments_live_only_in_the_workbench() -> None:
              for name in EXPERIMENTS:
                  assert not (ROOT / "chambers" / name).exists(), name
                  assert (ROOT / "workbench" / "experiments" / name).is_dir(), name

          def test_research_records_live_only_in_the_workbench() -> None:
              for name in ("autoresearch", "ideation", "research", "frontier", "stories"):
                  assert not (ROOT / "docs" / name).exists(), name
                  assert (ROOT / "workbench" / "notes" / name).is_dir(), name

          def test_maintained_python_does_not_import_the_workbench() -> None:
              violations: list[str] = []
              for path in sorted((ROOT / "chambers").rglob("*.py")):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          modules = [alias.name for alias in node.names]
                      elif isinstance(node, ast.ImportFrom) and node.module:
                          modules = [node.module]
                      else:
                          modules = []
                      for module in modules:
                          if module == "workbench" or module.startswith("workbench."):
                              violations.append(f"{path.relative_to(ROOT)} imports {module}")
              assert not violations, "\n".join(violations)

          def test_model_policy_is_not_an_operator_runbook() -> None:
              law = (ROOT / "chambers" / "CHAMBER.md").read_text(encoding="utf-8")
              assert law.startswith("# Chamber Law\n")
              assert "unzip chamber_v2.zip" not in law
              assert "cloudflared tunnel" not in law
              assert (ROOT / "chambers" / "reference" / "README.md").is_file()
          EOF

      - name: Regenerate evidence metadata and verify all Python contracts
        id: verify
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m chambers.compliance_kit.make_kit
          python -m compileall -q chambers workbench tests
          python -m pytest -q | tee "$RUNNER_TEMP/pytest.txt"
          python -m chambers.compliance_kit.make_kit --check | tee "$RUNNER_TEMP/kit.txt"
          git diff --check
          echo "pytest_summary=$(tail -n 1 "$RUNNER_TEMP/pytest.txt")" >> "$GITHUB_OUTPUT"
          echo "kit_summary=$(tail -n 1 "$RUNNER_TEMP/kit.txt")" >> "$GITHUB_OUTPUT"

      - name: Commit the clean tree and remove one-shot machinery
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-checkout-export.yml
          rm -f .github/workflows/agent-polish.yml
          rm -f .github/workflows/agent-finalize.yml
          rm -f .github/workflows/agent-recover.yml
          git add -A
          git diff --cached --check
          git commit -m "structure: separate the maintained system from the workbench"
          git fetch origin agent/consolidate-chamber
          git rebase origin/agent/consolidate-chamber || {
            git rebase --abort
            echo "remote advanced during recovery; refusing to overwrite it" >&2
            exit 1
          }
          git push origin HEAD:agent/consolidate-chamber

      - name: Wait for Python, Rust, and Lean on the final head
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            sleep 10
            if gh pr checks 2 --repo XyraSinclair/chambers --watch --fail-fast; then
              exit 0
            fi
          done
          exit 1

      - name: Publish the exact evidence ledger on the draft PR
        env:
          PYTEST_SUMMARY: ${{ steps.verify.outputs.pytest_summary }}
          KIT_SUMMARY: ${{ steps.verify.outputs.kit_summary }}
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Purpose

          Make the repository legible as a maintained technical system rather than as an undifferentiated research dump.

          ## Structural cut

          - Moved executable economies and mechanism probes into the non-normative \`workbench/experiments/\`.
          - Moved autoresearch, ideation, deep research, frontier papers, frameworks, and stories into \`workbench/notes/\`.
          - Added an enforced dependency direction: workbench code may exercise maintained interfaces; maintained Python may not import the workbench.
          - Moved the two large reference-application contract suites out of the import surface and into \`tests/reference/\`.

          ## Reference application

          - Split operator instructions from model-facing law. \`chambers/CHAMBER.md\` now contains Chamber Law; \`chambers/reference/README.md\` is the operator runbook.
          - Kept the application, court-file verifier, requester-bundle verifier, confinement demo, and compliance kit on the maintained side.
          - Did **not** merge the two offline verifiers. Their repeated parsing and hashing logic is an independence property: the requester checker remains pure standard library and textually independent of the writer.

          ## Public reading surface

          - Rewrote the root README around exact claims, public evidence, and explicit limits.
          - Added \`docs/ARCHITECTURE.md\` as the map of canon, protocol specs, implementations, proof scope, reference integration, and workbench.
          - Replaced the documentation and package indexes with short status-bearing maps.
          - Updated imports, commands, and repository links to the workbench paths.

          ## Compatibility

          Normative protocol identifiers, frozen trace bytes, charge arithmetic, finding codes, settlement law, and theorem statements are unchanged. Import paths for explicitly experimental packages changed from \`chambers.<experiment>\` to \`workbench.experiments.<experiment>\`; those paths are intentionally outside the maintained compatibility surface.

          ## Verification

          - Python: \`${PYTEST_SUMMARY}\`
          - Portable evidence manifest: \`${KIT_SUMMARY}\`
          - Final-head GitHub Actions: Python, Rust, and Lean checks passed before this body was published.
          EOF
          gh api --method PATCH repos/XyraSinclair/chambers/pulls/2 \
            --raw-field title='Separate the maintained system from the workbench' \
            --raw-field body="$(cat "$RUNNER_TEMP/pr-body.md")" >/dev/null
