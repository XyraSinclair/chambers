name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: reference (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  rust:
    name: counterparty twin (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chambers/kernel/rust_ledger
      - run: cargo test
        working-directory: chambers/kernel/rust_ledger

  lean:
    name: proof kernel (lake build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: chambers/lean
