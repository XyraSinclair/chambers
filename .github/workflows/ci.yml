name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 3 * *' # monthly: surface environment rot before a contributor's PR does

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: reference (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m chambers.landscape check
      - run: python -m pytest -q

  rust-accountant:
    name: counterparty accountant (Rust + Python cross-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chambers/conformance/rust
      - run: cargo test --locked
        working-directory: chambers/conformance/rust
      - run: cargo run --locked -- --emit out
        working-directory: chambers/conformance/rust
      - run: >-
          python -m chambers.conformance.check_conformance
          --actual chambers/conformance/rust/out

  rust-ledger:
    name: counterparty ledger (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chambers/kernel/rust_ledger
      - run: cargo test --locked
        working-directory: chambers/kernel/rust_ledger

  lean:
    name: proof kernel (lake build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: chambers/lean
